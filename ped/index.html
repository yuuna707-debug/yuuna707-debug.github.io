<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><link rel="manifest" href="../manifest.json"><meta name="theme-color" content="#1a7a3d"><title>小児救急外来 問診</title><style>
/* 成人英語版・小児2言語版（/en/ /ped/ /ped/en/）の共通スタイル。
 * build.py が <!--FORMSTYLE--> の位置へ丸ごと差し込むので、<style> ごと持っている。

 */

/* ★配色で版を区別する。成人=青・小児=緑。掲示ポスターの帯と揃えてあり、
   患者が別のフォームを開いていることに受付が気づけるようにしている。
   既定を緑（小児）にして、成人版だけ body.adult で青へ上書きする。 */
body.adult { --accent: #0b6bcb }

:root {
  --bg: #f5f7f6;
  --panel: #fff;
  --ink: #17211c;
  --sub: #58635d;
  --line: #ccd5d0;
  --accent: #1a7a3d;
  --warn: #b3261e;
}

* { box-sizing: border-box }

/* 待合で立ったまま・片手で操作する前提。17px は小さくしないこと。 */
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 17px/1.55 system-ui, -apple-system, "Segoe UI", "Noto Sans JP", sans-serif;
}

main { max-width: 880px; margin: auto; padding: 16px 14px 60px }

/* ---- カード ---- */

header, section {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
}
header { border-top: 8px solid var(--accent) }

h1 { font-size: 1.4rem; margin: 0 }
h2 { font-size: 1.08rem; margin: 0 0 12px; border-bottom: 1px solid var(--line); padding-bottom: 8px }
h3 { font-size: .95rem; color: var(--sub) }

/* 言語切替リンク。h1 の右肩へ載せる。 */
nav { float: right; margin-top: -1.8rem }
a { color: var(--accent) }

/* ---- 入力 ---- */

label { display: block; font-weight: 650; margin: 12px 0 5px }

.row { display: flex; gap: 10px; flex-wrap: wrap }
.row > * { flex: 1 1 200px }       /* 狭い画面では自動的に1列になる */
.field { min-width: 0 }            /* flex 内でテキストがはみ出さないように */

input, select, textarea, button { font: inherit }

/* チェックボックス・ラジオ・スライダーは自前の大きさで出したいので除外する。 */
input:not([type=checkbox]):not([type=radio]):not([type=range]), select, textarea {
  width: 100%;
  padding: 11px;
  color: inherit;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 8px;
}
textarea { min-height: 78px }

/* 症状などの複数選択。指で押せる大きさを確保する。 */
.chips { display: flex; flex-wrap: wrap; gap: 7px }
.chip {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 11px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--bg);
  font-size: .88rem;
  margin: 0;
}
.chip input { width: 19px; height: 19px }

/* ---- 通知 ---- */

.notice, .alert {
  padding: 10px 12px;
  border-radius: 8px;
  background: #e5f4ea;
  border: 1px solid var(--accent);
}
.alert { background: #fff0ef; border-color: var(--warn); color: var(--warn); margin: 10px 0 }
.hint { font-size: .83rem; color: var(--sub) }

/* 単位付きの入力（kg / lb、℃ / °F）。セレクトだけ幅を内容に合わせる。 */
.unitrow { display: flex; gap: 7px }
.unitrow input { flex: 1 }
.unitrow select { width: auto }

/* 元気さ・飲み食べ・痛みのスライダーと顔文字。 */
.rangebox { padding: 10px; border: 1px solid var(--line); border-radius: 8px; margin: 10px 0 }
.rangebox input { width: 100% }
.faces { display: flex; justify-content: space-between; font-size: 1.3rem }

/* ---- ボタン ---- */

/* 「入力をすべて消す」。取り消せない操作なので赤枠にする（押下時は confirm も出る）。 */
.danger {
  padding: 12px 16px;
  border-radius: 8px;
  border: 1px solid var(--warn);
  margin: 4px;
  color: var(--warn);
  background: #fff;
}

/* ---- QR ---- */

.controls { display: flex; gap: 12px; flex-wrap: wrap }
.controls label { font-size: .85rem }

#qrbox { display: flex; justify-content: center; background: #fff; padding: 12px }
/* ★補間させない。滑らかに拡大されるとモジュールの境界がぼけて読み取りが落ちる。 */
#qrbox canvas { max-width: 100%; height: auto; image-rendering: pixelated }

/* カルテに入る文字列のプレビュー。区切りなしで続くので強制的に折り返す。 */
pre {
  white-space: pre-wrap;
  word-break: break-all;
  background: var(--bg);
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
}

footer { text-align: center; color: var(--sub); font-size: .78rem; padding: 20px }

/* ★!important を外さないこと。ブラウザ既定の [hidden]{display:none} は
   作者側の display 指定（.chip / .unitrow / label など）に負けるため、
   そうした要素に hidden を付けても消えなくなる。隠したつもりの項目が
   画面に残ると、答えたのにQRに入らない（またはその逆）が起きる。 */
[hidden] { display: none !important }

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #151a17;
    --panel: #202622;
    --ink: #edf2ef;
    --sub: #aab4ae;
    --line: #3c4740;
    --accent: #70d493;
  }
}
</style>

const GF_EXP = new Uint8Array(512);

function polyMul(a, b) {

const _genCache = {};

/* ---------------- QR 本体 ---------------- */

const EC_ORDER = { L: 0, M: 1, Q: 2, H: 3 };
const EC_FORMAT_BITS = { L: 1, M: 0, Q: 3, H: 2 };

function dataCodewords(version, ec) {

function charCountBits(version) {

function buildCodewords(bytes, version, ec) {
  const cap = dataCodewords(version, ec);
  const bits = [];
  const put = (val, len) => {
    for (let i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1);

  put(0b0100, 4);
  put(bytes.length, charCountBits(version));
  for (const b of bytes) put(b, 8);

  const capBits = cap * 8;
  put(0, Math.min(4, capBits - bits.length)); // 終端子
  while (bits.length % 8 !== 0) bits.push(0);

  const words = [];
  for (let i = 0; i < bits.length; i += 8) {
    let v = 0;
    for (let j = 0; j < 8; j++) v = (v << 1) | bits[i + j];
    words.push(v);
  }

function interleave(words, version, ec) {
  const groups = RS_BLOCKS[version - 1][EC_ORDER[ec]];
  const dataBlocks = [];
  const ecBlocks = [];
  let pos = 0;
  for (const g of groups) {
    const count = g[0], total = g[1], dat = g[2];
    for (let i = 0; i < count; i++) {
      const d = words.slice(pos, pos + dat);
      pos += dat;
      dataBlocks.push(d);
      ecBlocks.push(rsEncode(d, total - dat));
    }
  }
  const out = [];
  const maxD = Math.max.apply(null, dataBlocks.map((b) => b.length));
  for (let i = 0; i < maxD; i++)
    for (const b of dataBlocks) if (i < b.length) out.push(b[i]);
  const maxE = Math.max.apply(null, ecBlocks.map((b) => b.length));
  for (let i = 0; i < maxE; i++)
    for (const b of ecBlocks) if (i < b.length) out.push(b[i]);

function bitLength(x) {
  let n = 0;
  while (x !== 0) {
    n++;
    x >>>= 1;
  }

function formatInfo(ec, mask) {

  return ((data << 10) | d) ^ 0x5412;

function versionInfo(version) {
  let d = version << 12;
  while (bitLength(d) >= 13) d ^= 0x1f25 << (bitLength(d) - 13);
  return (version << 12) | d;

const MASK_FN = [
  (r, c) => (r + c) % 2 === 0,
  (r, c) => r % 2 === 0,
  (r, c) => c % 3 === 0,
  (r, c) => (r + c) % 3 === 0,
  (r, c) => (((r / 2) | 0) + ((c / 3) | 0)) % 2 === 0,
  (r, c) => ((r * c) % 2) + ((r * c) % 3) === 0,
  (r, c) => ((((r * c) % 2) + ((r * c) % 3)) % 2) === 0,
  (r, c) => ((((r + c) % 2) + ((r * c) % 3)) % 2) === 0,

function buildFunctionPatterns(version) {
  const size = version * 4 + 17;

  finder(0, size - 7);
  finder(size - 7, 0);

        for (let dc = -2; dc <= 2; dc++) {

          const edge = Math.abs(dr) === 2 || Math.abs(dc) === 2;

          m[rr][cc] = edge || center ? 1 : 0;

    if (!res[i][8]) { res[i][8] = true; }

    res[8][size - 1 - i] = true;
  }

  res[size - 8][8] = true;

function placeData(base, codewords) {

          idx++;
        }
      }
      row += dir;
      if (row < 0 || row >= size) {

        dir = -dir;

      }

function applyMask(m, res, size, mask) {
  const out = m.map((row) => row.slice());

/**
 * 形式情報15ビット（ビット0から順に、列8を上→下・行8を右→左）と型番情報を書き込む。
 * test=true のときは全て0にする。マスク選択の評価はこの状態の行列に対して行う

 */
function writeFormat(out, size, ec, mask, version, test) {
  const fmt = formatInfo(ec, mask);
  for (let i = 0; i < 15; i++) {
    const b = test ? 0 : (fmt >> i) & 1;
    if (i < 6) out[i][8] = b;
    else if (i < 8) out[i + 1][8] = b;
    else out[size - 15 + i][8] = b;

    else if (i === 8) out[8][7] = b;
    else out[8][14 - i] = b;

function penalty(m) {

  for (let k = 0; k < 2; k++) {

      let run = 1;
      for (let j = 1; j < size; j++) {
        const cur = k === 0 ? m[i][j] : m[j][i];
        const prev = k === 0 ? m[i][j - 1] : m[j - 1][i];
        if (cur === prev) {
          run++;
        } else {
          if (run >= 5) score += 3 + (run - 5);
          run = 1;
        }
      }
      if (run >= 5) score += 3 + (run - 5);
    }
  }

  for (let r = 0; r < size - 1; r++)
    for (let c = 0; c < size - 1; c++) {
      const v = m[r][c];
      if (v === m[r][c + 1] && v === m[r + 1][c] && v === m[r + 1][c + 1]) score += 3;
    }

    for (let k = 0; k < 11; k++) if (get(i + k) !== p[k]) return false;
    return true;
  };

    for (let j = 0; j <= size - 11; j++) {
      const rowGet = (x) => m[i][x];
      const colGet = (x) => m[x][i];

      if (match(rowGet, j, P2)) score += 40;
      if (match(colGet, j, P1)) score += 40;
      if (match(colGet, j, P2)) score += 40;
    }
  }

  // 規則4: 明暗の偏り
  let dark = 0;
  for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) dark += m[r][c];

  score += Math.floor(Math.abs((dark * 100) / total - 50) / 5) * 10;

/**
 * バイト列から QR のモジュール行列を作る。
 * @returns {{modules:number[][], size:number, version:number, ec:string, mask:number}}
 */
function qrFromBytes(bytes, ec, minVersion, forceMask) {
  ec = ec || 'M';
  const version = chooseVersion(bytes.length, ec, minVersion);
  if (!version) throw new Error('データが大きすぎてQRに入りません（' + bytes.length + ' バイト）');

  const words = interleave(buildCodewords(bytes, version, ec), version, ec);
  const base = buildFunctionPatterns(version);
  const raw = placeData(base, words);

  let bestMask = 0;
  if (forceMask != null) {
    bestMask = forceMask;
  } else {
    let bestScore = Infinity;
    for (let mask = 0; mask < 8; mask++) {
      const cand = writeFormat(
        applyMask(raw, base.res, base.size, mask), base.size, ec, mask, version, true);

      if (p < bestScore) { bestScore = p; bestMask = mask; } // 同点は若い番号を優先

    applyMask(raw, base.res, base.size, bestMask), base.size, ec, bestMask, version, false);

}

function maxBytes(version, ec) {
  return dataCodewords(version, ec) - Math.ceil((4 + charCountBits(version)) / 8);
}

  function identity(header) {
    const a = ageAt(val('dob'));
    const line = `${header}${val('pid') ? 'ID' + clean(val('pid')) + ' ' : ''}${clean(val('name'))}` +
      `${val('kana') ? ' (' + clean(val('kana')) + ')' : ''} ${val('dob').replace(/-/g, '/')}` +
      `${a ? ' ' + a.years + '歳' : ''} ${val('sex')}`;
    return line.trim();
  }

  /* ---- QRに載せる文字列 ----
     ★項目名も選択値も常に日本語。英語版でも変えない（カルテが日本語運用）。
     自由記述だけは患者が書いたまま入るので、英語版は「入力言語:English」を
     先頭付近に入れて、職員が英語混じりだと分かるようにする。 */

  function adultText() {
    const a = [], sep = $('sep').value;
    add(a, '', identity('【問診】') + sep + '受付' + (val('recv') || '-') + ' ' + val('who') + ' ' + stamp());
    if (en) add(a, '入力言語', 'English');
    add(a, '', val('first'));
    const tr = val('trigger');
    if (tr) add(a, 'きっかけ', tr + (val('reffrom') ? '（' + val('reffrom') + '）' : ''));
    add(a, '労災・自賠責', checked('insurance').filter((x) => x !== 'どちらでもない').join('、'));
    add(a, '緊急連絡先', [val('emName'), val('emPhone')].filter(Boolean).join(' '));

    const b = radio('branch');
    if (b === 'geka') {
      add(a, '', '【外傷・整形】');
      add(a, '症状', checked('gSympt').join('、'));
      add(a, '部位', checked('gSite').concat(val('gSiteOther') || []).join('、'));
      add(a, '発症', relative('gOnset'));
      add(a, '受傷機転', val('gCause'));
      add(a, '手術歴', val('gSurg'));
      add(a, '治療中', checked('gHx').concat(val('gHxOther') || []).join('、'));
    } else if (b === 'naika') {
      add(a, '', '【内科】');
      add(a, '症状', checked('nSympt').concat(val('nSymptOther') || []).join('、'));
      add(a, '体温', metricTemp());
      add(a, '発症', relative('nOnset'));
      add(a, '周囲の同症状', val('nAround'));
      add(a, '旅行・渡航', val('nTravel'));
      add(a, '感染症', checked('nInfect').join('、'));
      add(a, '治療中', checked('nHx').concat(val('nHxOther') || []).join('、'));
    }

    add(a, '抗凝固・抗血小板', checked('anticoag').join('、'));
    const al = [];
    if (val('algDrug')) al.push('薬=' + val('algDrug'));
    if (val('algFood')) al.push('食物=' + val('algFood'));
    add(a, 'アレルギー', al.join(' '));
    add(a, '最終飲食', relative('lastMeal', true));
    add(a, '体重', metricWeight());
    add(a, '妊娠', val('preg') + (val('pregDetail') ? '（' + val('pregDetail') + '）' : ''));
    add(a, 'かかりつけ', val('primaryDoctor'));
    add(a, 'その他', val('other'));
    return a.join(sep);
  }

  function pedText() {
    const a = [], sep = $('sep').value, age = ageAt(val('dob'));
    /* 成人版と出所を区別できるようヘッダを分ける（【救急隊ホットライン】等と同じ考え方）。 */
    add(a, '', identity('【小児問診】') + sep + stamp());
    if (en) add(a, '入力言語', 'English');
    add(a, '体重', metricWeight());

    /* 画面に出していない項目はQRにも入れない。年齢条件は update() の表示条件と対で持つ。 */
    if (age && age.months < 180) {
      add(a, '保護者', [val('guardianName'), radio('relationship'), val('guardianPhone')].filter(Boolean).join(' '));
      add(a, '別の緊急連絡先', val('emergencyContact'));
    }
    add(a, '主訴', radio('complaint'));
    add(a, '発症', relative('pOnset'));
    add(a, '体温', metricTemp());
    add(a, '症状・経過', val('symptoms'));

    if (age && age.months < 24) {
      add(a, '妊娠週数', val('gestationalWeeks') ? (val('gestationalWeeks') + '週 ' + radio('gestationalTerm')) : '');
      if (val('birthWeight')) {
        add(a, '出生体重', C.birthWeightToG(val('birthWeight'), val('birthWeightUnit'), val('birthWeightOz')) + 'g');
      }
      add(a, '先天異常', radio('congenital') +
        (radio('congenital') === '有' && val('congenitalDetail') ? '（' + val('congenitalDetail') + '）' : ''));
      add(a, '発達の心配', radio('developmentConcern') +
        (radio('developmentConcern') === '有' && val('developmentDetail') ? '（' + val('developmentDetail') + '）' : ''));
    }
    if (age && age.months < 72) {
      add(a, '予防接種', radio('vaccinationStatus'));
      add(a, '直近の接種', [val('lastVaccinationDate'), val('lastVaccine')].filter(Boolean).join(' '));
    }
    if (age && age.months < 180) {
      /* 元気さ（lethargy）は小児救急の重篤徴候。保護者が答えられる形にしてある。 */
      add(a, '元気さ', C.choices('energy')[+$('energy').value].value);
      add(a, '飲食状況', C.choices('intake')[+$('intake').value].value);
      add(a, '排尿・排便', val('elimination'));
      for (const [name, label, detail] of [
        ['seizure', 'けいれん', 'seizureDetail'],
        ['febrileSeizure', '熱性けいれん歴', 'febrileDetail'],
        ['rash', '発疹', 'rashDetail'],
      ]) {
        add(a, label, radio(name) + (radio(name) === '有' && val(detail) ? '（' + val(detail) + '）' : ''));
      }
    }
    add(a, '痛み', C.choices('pain')[+$('pain').value].value);
    add(a, '使用中の薬', val('medications'));
    add(a, 'アレルギー', val('allergies'));
    add(a, '最終飲食', relative('lastMeal', true));
    add(a, 'かかりつけ', val('primaryDoctor'));
    add(a, 'その他', val('other'));
    return a.join(sep);
  }

  /* ---- 表示 ---- */

  /* enc.normalized は「?」へ置換する前の文字列なので、そのまま出すと実際に
     カルテへ入るものと食い違う。dropped の位置を ? に潰して実物を見せる。
     𠮷（つちよし）のような人名異体字でも起きるので、日本語版でも必要。 */
  function delivered(enc) {
    if (!enc.dropped.length) return enc.normalized;
    let r = '', p = 0;
    for (const d of enc.dropped) {
      r += enc.normalized.slice(p, d.index) + '?';
      p = d.index + d.ch.length;
    }
    return r + enc.normalized.slice(p);
  }

  function draw(res) {
    const q = 4, scale = 5, n = res.size + q * 2;
    const c = document.createElement('canvas');
    c.width = c.height = n * scale;
    const g = c.getContext('2d');
    g.fillStyle = '#fff';
    g.fillRect(0, 0, c.width, c.height);
    g.fillStyle = '#000';
    for (let r = 0; r < res.size; r++) {
      for (let col = 0; col < res.size; col++) {
        if (res.modules[r][col]) g.fillRect((col + q) * scale, (r + q) * scale, scale, scale);
      }
    }
    $('qrbox').replaceChildren(c);
  }

  /* 換算の表示と、条件付きセクションの出し入れ。QR文字列側の年齢条件と対になっている
     （片方だけ直すと、画面に出ていない項目がQRに入る／その逆が起きる）。 */
  function update() {
    if ($('weightConverted')) {
      $('weightConverted').textContent =
        val('weight') && $('weightUnit').value === 'lb' ? `→ ${C.lbToKg(val('weight'))} kg` : '';
    }
    if ($('tempConverted')) {
      $('tempConverted').textContent =
        val('temperature') && $('tempUnit').value === 'F' ? `→ ${C.fToC(val('temperature'))} ℃` : '';
    }
    if ($('birthWeightOz')) $('birthWeightOz').hidden = $('birthWeightUnit').value !== 'lb';
    if ($('birthWeightConverted')) {
      $('birthWeightConverted').textContent = val('birthWeight')
        ? `→ ${C.birthWeightToG(val('birthWeight'), val('birthWeightUnit'), val('birthWeightOz'))} g` : '';
    }

    if (mode === 'adult') {
      const b = radio('branch');
      $('geka').hidden = b !== 'geka';
      $('naika').hidden = b !== 'naika';
      $('adultCommon').hidden = !b;
      return;
    }

    const a = ageAt(val('dob'));
    for (const [id, show] of [
      ['guardian', a && a.months < 180],
      ['pedSymptoms', a && a.months < 180],
      ['vaccination', a && a.months < 72],
      ['development', a && a.months < 24],
    ]) $(id).hidden = !show;

    if (a) {
      $('ageBadge').hidden = false;
      $('ageBadge').textContent = t(`${a.years}歳${a.monthPart}か月`, `${a.years} years ${a.monthPart} months`);
    } else {
      $('ageBadge').hidden = true;
    }

    for (const [name, detail] of [
      ['seizure', 'seizureDetail'], ['febrileSeizure', 'febrileDetail'], ['rash', 'rashDetail'],
      ['congenital', 'congenitalDetail'], ['developmentConcern', 'developmentDetail'],
    ]) if ($(detail)) $(detail).hidden = radio(name) !== '有';

    for (const id of ['energy', 'intake', 'pain']) {
      $(id + 'Out').textContent = C.label(C.choices(id)[+$(id).value], lang);
    }
  }

  /* 入力しながらQRが育つ。氏名・生年月日が埋まるまではQRを出さないが、
     白紙の時点で赤字を出すと急かすだけなので、一度触ってから出す。 */
  let touched = false;

  function renderQR() {
    let err = !val('name') ? t('氏名を入力してください。', 'Enter the name.')
      : !ageAt(val('dob')) ? t('生年月日を入力してください。', 'Enter a valid date of birth.')
      : '';
    if (mode === 'pediatric') {
      const a = ageAt(val('dob'));
      if (!err && a.months < 180 && (!val('guardianName') || !val('guardianPhone') || !radio('relationship'))) {
        err = t('保護者の氏名・続柄・電話を入力してください。',
          'Enter the guardian name, relationship and phone.');
      }
    }
    $('error').hidden = !(err && touched);
    $('error').textContent = err;
    if (err) {
      $('qrbox').replaceChildren();
      $('out').textContent = '';
      return;
    }

    const text = mode === 'pediatric' ? pedText() : adultText();
    const enc = encodeSJIS(text);
    $('out').textContent = delivered(enc);

    const warnings = [];
    if ($('sep').value === '\n') {
      warnings.push(t('改行は実機で消えるため使用できません。',
        'Newlines disappear on the scanner and must not be used.'));
    }
    if (enc.dropped.length) {
      warnings.push(t('Shift-JISに変換できない文字を「?」に置換しました: ',
        'Characters unsupported by Shift-JIS were replaced with “?”: ') +
        [...new Set(enc.dropped.map((x) => x.ch))].join(' '));
    }
    $('warnings').innerHTML = warnings.map((x) => `<div class="alert">${esc(x)}</div>`).join('');

    try {
      const res = qrFromBytes(enc.bytes, $('ec').value);
      draw(res);
      $('meta').textContent = `Shift-JIS ${enc.bytes.length} bytes / v${res.version} / ${res.ec}`;
    } catch (x) {
      $('qrbox').replaceChildren();
      $('error').hidden = false;
      $('error').textContent = t(x.message,
        'The answers are too long for one QR code. Please shorten free-text answers or select error correction L.');
    }
  }

  /* ---- 配線 ---- */

  /* ★ボタンの id を 'reset' にしてはいけない。フォーム内のコントロールは form の
     名前付きプロパティになるため、id="reset" は HTMLFormElement.reset() を隠す。
     $('form').reset() が TypeError で落ち、**入力が消えないのに消えたように見える**。
     共用端末では前の患者の答えが残ることになる。実際にこれで壊れていた。 */
  $('clearAll').addEventListener('click', () => {
    if (!confirm(t('入力をすべて消します。よろしいですか？', 'Clear all answers?'))) return;
    sessionStorage.removeItem(storageKey);
    $('form').reset();
    $('qrbox').replaceChildren();
    $('out').textContent = '';
    $('warnings').innerHTML = '';
    $('meta').textContent = '';
    $('error').hidden = true;
    touched = false;
    update();
  });

  function responseChanged() {
    touched = true;
    saveForm();
    update();
    renderQR();
  }

  /* 未来日を弾く。入れられても検証で止まるが、カレンダーの時点で選べないほうが早い。 */
  (function () {
    const n = new Date(), p = (x) => String(x).padStart(2, '0');
    const today = n.getFullYear() + '-' + p(n.getMonth() + 1) + '-' + p(n.getDate());
    for (const el of document.querySelectorAll('input[type=date]')) el.max = today;
  })();

  /* 入力欄で Enter を押すと form が暗黙送信され、ページが再読み込みされて入力が飛ぶ。 */
  $('form').addEventListener('submit', (e) => { e.preventDefault(); touched = true; renderQR(); });

  restoreForm();
  document.addEventListener('input', responseChanged);
  document.addEventListener('change', responseChanged);
  update();
  renderQR();
})();
</script><script>if(location.protocol==='https:'&&'serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('../sw.js'));</script></body></html>
